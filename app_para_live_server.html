<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HogarSync - Administrador del Hogar</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone to compile React JSX directly in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .font-mono-numbers { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
  <div id="root">
    <div style="padding: 2rem; text-align: center; font-family: sans-serif; color: #64748b;">
      Cargando Administrador del Hogar...
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- ICONOS SVG MINIMALISTAS INTEGRADOS ---
    const Icons = {
      Home: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>,
      Receipt: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2zM10 8.5a.5.5 0 11-1 0 .5.5 0 011 0zm5 5a.5.5 0 11-1 0 .5.5 0 011 0z"/></svg>,
      CheckSquare: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>,
      Wrench: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>,
      Calendar: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>,
      Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4"/></svg>,
      RotateCw: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>,
      Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7"/></svg>,
      AlertTriangle: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>,
      Clock: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
      Users: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>,
      X: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>,
    };

    // --- DATOS INICIALES DEL HOGAR ---
    const INITIAL_MEMBERS = [
      { id: 'm1', name: 'Carlos Mendoza', role: 'Administrador', color: '#0284c7' },
      { id: 'm2', name: 'Lucía Morales', role: 'Roommate', color: '#059669' },
      { id: 'm3', name: 'Mateo Rivas', role: 'Roommate', color: '#7c3aed' },
      { id: 'm4', name: 'Elena Silva', role: 'Familia', color: '#ea580c' },
    ];

    const INITIAL_BILLS = [
      { id: 'b1', title: 'Energía Eléctrica (Luz)', amount: 84.50, dueDate: '2026-10-27', status: 'pendiente', category: 'Luz' },
      { id: 'b2', title: 'Fibra Óptica 1Gbps + WiFi', amount: 45.00, dueDate: '2026-10-30', status: 'pendiente', category: 'Internet' },
      { id: 'b3', title: 'Alquiler del Hogar (Noviembre)', amount: 950.00, dueDate: '2026-11-01', status: 'pendiente', category: 'Alquiler' },
      { id: 'b4', title: 'Gas Natural (Calefacción y Cocina)', amount: 52.80, dueDate: '2026-10-22', status: 'pagado', category: 'Gas', paidBy: 'Lucía' },
      { id: 'b5', title: 'Cuota de Comunidad / Edificio', amount: 60.00, dueDate: '2026-10-25', status: 'pendiente', category: 'Comunidad' },
      { id: 'b6', title: 'Agua Potable', amount: 32.40, dueDate: '2026-11-08', status: 'pendiente', category: 'Agua' },
    ];

    const INITIAL_CHORES = [
      { id: 'c1', title: 'Sacar basura general y contenedores de reciclaje', assignedId: 'm1', room: 'Cocina', time: 10, done: false },
      { id: 'c2', title: 'Desinfectar encimeras y platos de la cena', assignedId: 'm2', room: 'Cocina', time: 20, done: true },
      { id: 'c3', title: 'Limpieza profunda de baño principal', assignedId: 'm3', room: 'Baño', time: 45, done: false },
      { id: 'c4', title: 'Aspirar y fregar suelo del salón/comedor', assignedId: 'm2', room: 'Salón', time: 35, done: false },
      { id: 'c5', title: 'Revisar despensa y compra semanal básica', assignedId: 'm1', room: 'Cocina', time: 40, done: false },
      { id: 'c6', title: 'Regar plantas de terraza e interior', assignedId: 'm3', room: 'Terraza', time: 15, done: true },
    ];

    const INITIAL_MAINTENANCE = [
      { id: 'm-air', title: 'Limpieza de filtros de Aire Acondicionado', freq: 'Cada 3 meses', nextDue: '2026-10-28', status: 'proximo', cost: 0, provider: 'Bricolaje' },
      { id: 'm-hood', title: 'Desengrase de filtros de Campana Extractora', freq: 'Cada 2 meses', nextDue: '2026-10-20', status: 'urgente', cost: 12, provider: 'Mantenimiento Hogar' },
      { id: 'm-boiler', title: 'Revisión y purgado de caldera/calefón', freq: 'Cada 12 meses', nextDue: '2026-11-15', status: 'proximo', cost: 85, provider: 'Servicio ClimaGas' },
      { id: 'm-safety', title: 'Prueba de detectores de humo y extintor', freq: 'Cada 6 meses', nextDue: '2026-11-10', status: 'al_dia', cost: 0, provider: 'Revisión Interna' },
    ];

    function formatEur(amount) {
      return '€' + Number(amount).toFixed(2);
    }

    // --- COMPONENTE PRINCIPAL ---
    function App() {
      const [tab, setTab] = useState('resumen');
      const [bills, setBills] = useState(() => {
        const s = localStorage.getItem('hs_bills');
        return s ? JSON.parse(s) : INITIAL_BILLS;
      });
      const [chores, setChores] = useState(() => {
        const s = localStorage.getItem('hs_chores');
        return s ? JSON.parse(s) : INITIAL_CHORES;
      });
      const [maintenance, setMaintenance] = useState(() => {
        const s = localStorage.getItem('hs_maint');
        return s ? JSON.parse(s) : INITIAL_MAINTENANCE;
      });
      const [members] = useState(INITIAL_MEMBERS);
      const [showNewBillModal, setShowNewBillModal] = useState(false);
      const [newBillTitle, setNewBillTitle] = useState('');
      const [newBillAmount, setNewBillAmount] = useState('');
      const [newBillDate, setNewBillDate] = useState('2026-10-31');
      const [newBillCategory, setNewBillCategory] = useState('Luz');

      useEffect(() => {
        localStorage.setItem('hs_bills', JSON.stringify(bills));
      }, [bills]);
      useEffect(() => {
        localStorage.setItem('hs_chores', JSON.stringify(chores));
      }, [chores]);
      useEffect(() => {
        localStorage.setItem('hs_maint', JSON.stringify(maintenance));
      }, [maintenance]);

      // Métricas
      const pendingBills = bills.filter(b => b.status === 'pendiente');
      const totalPending = pendingBills.reduce((acc, b) => acc + b.amount, 0);
      const totalPaid = bills.filter(b => b.status === 'pagado').reduce((acc, b) => acc + b.amount, 0);
      const completedChores = chores.filter(c => c.done).length;

      // Pagar factura
      const handlePayBill = (id) => {
        setBills(bills.map(b => b.id === id ? { ...b, status: 'pagado', paidBy: 'Carlos' } : b));
      };

      // Toggle tarea
      const handleToggleChore = (id) => {
        setChores(chores.map(c => c.id === id ? { ...c, done: !c.done } : c));
      };

      // Rotar turnos
      const handleRotateChores = () => {
        const memberIds = members.map(m => m.id);
        setChores(chores.map(c => {
          const currIdx = memberIds.indexOf(c.assignedId);
          const nextIdx = (currIdx + 1) % memberIds.length;
          return { ...c, assignedId: memberIds[nextIdx], done: false };
        }));
        alert('¡Turnos rotados exitosamente entre todos los miembros!');
      };

      // Registrar mantenimiento hecho
      const handleLogMaint = (id) => {
        setMaintenance(maintenance.map(m => m.id === id ? { ...m, status: 'al_dia', nextDue: '2027-01-28' } : m));
        alert('¡Mantenimiento actualizado y programado para el próximo ciclo!');
      };

      // Agregar factura
      const handleAddBill = (e) => {
        e.preventDefault();
        if (!newBillTitle || !newBillAmount) return;
        const newB = {
          id: 'b-' + Date.now(),
          title: newBillTitle,
          amount: parseFloat(newBillAmount),
          dueDate: newBillDate,
          status: 'pendiente',
          category: newBillCategory,
        };
        setBills([newB, ...bills]);
        setNewBillTitle('');
        setNewBillAmount('');
        setShowNewBillModal(false);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* HEADER */}
          <header className="sticky top-0 z-40 bg-white border-b border-slate-200">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-lg bg-sky-600 text-white flex items-center justify-center font-bold">
                  <Icons.Home />
                </div>
                <span className="text-lg font-bold text-slate-900">HogarSync</span>
              </div>

              {/* TABS DE NAVEGACIÓN */}
              <nav className="flex items-center gap-4 text-xs font-semibold overflow-x-auto">
                <button onClick={() => setTab('resumen')} className={`px-2.5 py-1.5 rounded-lg transition-colors ${tab === 'resumen' ? 'bg-sky-100 text-sky-800' : 'text-slate-600 hover:text-slate-900'}`}>Resumen</button>
                <button onClick={() => setTab('facturas')} className={`px-2.5 py-1.5 rounded-lg transition-colors ${tab === 'facturas' ? 'bg-sky-100 text-sky-800' : 'text-slate-600 hover:text-slate-900'}`}>Facturas ({pendingBills.length})</button>
                <button onClick={() => setTab('tareas')} className={`px-2.5 py-1.5 rounded-lg transition-colors ${tab === 'tareas' ? 'bg-sky-100 text-sky-800' : 'text-slate-600 hover:text-slate-900'}`}>Tareas ({completedChores}/{chores.length})</button>
                <button onClick={() => setTab('mantenimiento')} className={`px-2.5 py-1.5 rounded-lg transition-colors ${tab === 'mantenimiento' ? 'bg-sky-100 text-sky-800' : 'text-slate-600 hover:text-slate-900'}`}>Mantenimiento</button>
              </nav>

              <button onClick={() => setShowNewBillModal(true)} className="px-3 py-1.5 text-xs font-semibold text-white bg-sky-600 hover:bg-sky-700 rounded-lg flex items-center gap-1 shadow-sm shrink-0">
                <Icons.Plus /> <span>Factura</span>
              </button>
            </div>
          </header>

          {/* CONTENIDO PRINCIPAL */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6">
            {tab === 'resumen' && (
              <div className="space-y-6">
                {/* TARJETAS KPI */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white border border-slate-200 rounded-xl p-4">
                    <div className="text-xs font-semibold text-slate-400 uppercase">Facturas Pendientes</div>
                    <div className="text-2xl font-bold font-mono-numbers text-slate-900 mt-1">{formatEur(totalPending)}</div>
                    <div className="text-xs text-slate-500 mt-0.5">{pendingBills.length} por liquidar</div>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-xl p-4">
                    <div className="text-xs font-semibold text-slate-400 uppercase">Total Pagado</div>
                    <div className="text-2xl font-bold font-mono-numbers text-emerald-600 mt-1">{formatEur(totalPaid)}</div>
                    <div className="text-xs text-emerald-600 mt-0.5">Al día en servicios</div>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-xl p-4">
                    <div className="text-xs font-semibold text-slate-400 uppercase">Tareas de Hoy</div>
                    <div className="text-2xl font-bold font-mono-numbers text-slate-900 mt-1">{completedChores} / {chores.length}</div>
                    <div className="text-xs text-slate-500 mt-0.5">{Math.round((completedChores/chores.length)*100)}% de avance</div>
                  </div>

                  <div className="bg-white border border-slate-200 rounded-xl p-4">
                    <div className="text-xs font-semibold text-slate-400 uppercase">Mantenimiento Urgente</div>
                    <div className="text-sm font-bold text-rose-600 mt-2 truncate">Campana Extractora</div>
                    <div className="text-xs text-slate-500">Desengrase requerido</div>
                  </div>
                </div>

                {/* DIVISIÓN DE CONTENIDO EN 2 COLUMNAS */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* COLUMNA 1: FACTURAS PRÓXIMAS */}
                  <div className="bg-white border border-slate-200 rounded-xl p-5 space-y-3">
                    <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                      <h2 className="text-sm font-bold text-slate-900 flex items-center gap-1.5">
                        <Icons.Receipt /> Facturas Próximas a Vencer
                      </h2>
                      <button onClick={() => setTab('facturas')} className="text-xs text-sky-600 hover:underline">Ver todas</button>
                    </div>

                    <div className="space-y-2">
                      {pendingBills.slice(0, 4).map(b => (
                        <div key={b.id} className="p-3 bg-slate-50 rounded-lg flex items-center justify-between gap-3 text-xs">
                          <div>
                            <div className="font-semibold text-slate-900">{b.title}</div>
                            <div className="text-slate-500 text-[11px]">Vence: {b.dueDate} · {b.category}</div>
                          </div>
                          <div className="flex items-center gap-3">
                            <span className="font-mono-numbers font-bold text-slate-900">{formatEur(b.amount)}</span>
                            <button onClick={() => handlePayBill(b.id)} className="px-2.5 py-1 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded transition-colors">
                              Pagar
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* COLUMNA 2: TAREAS DOMÉSTICAS DE HOY */}
                  <div className="bg-white border border-slate-200 rounded-xl p-5 space-y-3">
                    <div className="flex items-center justify-between pb-2 border-b border-slate-100">
                      <h2 className="text-sm font-bold text-slate-900 flex items-center gap-1.5">
                        <Icons.CheckSquare /> Tareas Asignadas Hoy
                      </h2>
                      <button onClick={handleRotateChores} className="text-xs text-emerald-700 font-semibold hover:underline flex items-center gap-1">
                        <Icons.RotateCw /> Rotar turnos
                      </button>
                    </div>

                    <div className="space-y-2">
                      {chores.map(c => {
                        const member = members.find(m => m.id === c.assignedId);
                        return (
                          <div key={c.id} onClick={() => handleToggleChore(c.id)} className={`p-2.5 rounded-lg border transition-all cursor-pointer flex items-center justify-between gap-2 text-xs ${c.done ? 'bg-slate-50 border-slate-200 opacity-60' : 'bg-white border-slate-200 hover:border-emerald-300'}`}>
                            <div className="flex items-center gap-2">
                              <input type="checkbox" checked={c.done} onChange={() => {}} className="rounded text-emerald-600 pointer-events-none" />
                              <span className={c.done ? 'line-through text-slate-400' : 'text-slate-800 font-medium'}>{c.title}</span>
                            </div>
                            <span className="text-[10px] px-1.5 py-0.5 rounded font-semibold text-slate-600 bg-slate-100">{member?.name.split(' ')[0]}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB FACTURAS */}
            {tab === 'facturas' && (
              <div className="bg-white border border-slate-200 rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <h2 className="text-base font-bold text-slate-900">Control de Facturas y División de Gastos</h2>
                  <button onClick={() => setShowNewBillModal(true)} className="px-3 py-1.5 text-xs font-semibold text-white bg-sky-600 hover:bg-sky-700 rounded-lg flex items-center gap-1">
                    <Icons.Plus /> Nueva Factura
                  </button>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase">
                      <tr>
                        <th className="py-2.5 px-3">Servicio</th>
                        <th className="py-2.5 px-3">Categoría</th>
                        <th className="py-2.5 px-3 text-right">Importe</th>
                        <th className="py-2.5 px-3">Vencimiento</th>
                        <th className="py-2.5 px-3">Estado</th>
                        <th className="py-2.5 px-3 text-right">Acción</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {bills.map(b => (
                        <tr key={b.id} className="hover:bg-slate-50">
                          <td className="py-3 px-3 font-semibold text-slate-900">{b.title}</td>
                          <td className="py-3 px-3 text-slate-600">{b.category}</td>
                          <td className="py-3 px-3 text-right font-mono-numbers font-bold text-slate-900">{formatEur(b.amount)}</td>
                          <td className="py-3 px-3 text-slate-700">{b.dueDate}</td>
                          <td className="py-3 px-3">
                            {b.status === 'pagado' ? (
                              <span className="text-emerald-700 font-semibold flex items-center gap-1"><Icons.Check /> Pagado</span>
                            ) : (
                              <span className="text-rose-600 font-semibold flex items-center gap-1"><Icons.Clock /> Pendiente</span>
                            )}
                          </td>
                          <td className="py-3 px-3 text-right">
                            {b.status === 'pendiente' && (
                              <button onClick={() => handlePayBill(b.id)} className="px-2.5 py-1 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded">
                                Pagar
                              </button>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB TAREAS */}
            {tab === 'tareas' && (
              <div className="bg-white border border-slate-200 rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div>
                    <h2 className="text-base font-bold text-slate-900">División Equitativa de Tareas Domésticas</h2>
                    <p className="text-xs text-slate-500">Haz clic en una tarea para marcarla como completada o usa Rotar para cambiar de turnos.</p>
                  </div>
                  <button onClick={handleRotateChores} className="px-3 py-1.5 text-xs font-semibold text-emerald-800 bg-emerald-100 hover:bg-emerald-200 rounded-lg flex items-center gap-1.5">
                    <Icons.RotateCw /> Rotar Turnos
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {chores.map(c => {
                    const member = members.find(m => m.id === c.assignedId);
                    return (
                      <div key={c.id} onClick={() => handleToggleChore(c.id)} className={`p-3.5 rounded-xl border transition-all cursor-pointer flex flex-col justify-between ${c.done ? 'bg-slate-50 border-slate-200 opacity-60' : 'bg-white border-slate-200 hover:border-emerald-300'}`}>
                        <div className="flex items-start justify-between gap-2">
                          <span className={`text-sm font-semibold ${c.done ? 'line-through text-slate-400' : 'text-slate-900'}`}>{c.title}</span>
                          <input type="checkbox" checked={c.done} onChange={() => {}} className="pointer-events-none text-emerald-600 rounded mt-1" />
                        </div>
                        <div className="flex items-center justify-between text-xs text-slate-500 pt-2 mt-2 border-t border-slate-100">
                          <span>{c.room} · {c.time} min</span>
                          <span className="font-semibold text-slate-800">Asignado: {member?.name}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB MANTENIMIENTO */}
            {tab === 'mantenimiento' && (
              <div className="bg-white border border-slate-200 rounded-xl p-5 space-y-4">
                <div className="pb-3 border-b border-slate-100">
                  <h2 className="text-base font-bold text-slate-900">Calendario de Mantenimiento Preventivo</h2>
                  <p className="text-xs text-slate-500">Evita averías costosas y mantén en regla filtros, calderas y seguridad del hogar.</p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {maintenance.map(m => (
                    <div key={m.id} className="p-4 bg-white border border-slate-200 rounded-xl space-y-3">
                      <div className="flex items-start justify-between">
                        <div>
                          <span className="text-[11px] text-slate-400 uppercase font-semibold">{m.freq}</span>
                          <h3 className="text-sm font-bold text-slate-900 mt-0.5">{m.title}</h3>
                        </div>
                        <span className={`text-[11px] font-bold px-2 py-0.5 rounded ${m.status === 'urgente' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800'}`}>
                          {m.status === 'urgente' ? 'Vencido' : 'Próximo'}
                        </span>
                      </div>
                      <div className="flex items-center justify-between text-xs text-slate-600 pt-2 border-t border-slate-100">
                        <span>Próxima fecha: <strong>{m.nextDue}</strong></span>
                        <button onClick={() => handleLogMaint(m.id)} className="px-2.5 py-1 text-xs font-semibold text-white bg-amber-600 hover:bg-amber-700 rounded">
                          Registrar Hecho
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* MODAL NUEVA FACTURA */}
          {showNewBillModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40">
              <div className="bg-white rounded-xl max-w-sm w-full p-5 space-y-3 border border-slate-200 shadow-xl">
                <div className="flex justify-between items-center pb-2 border-b">
                  <h3 className="text-sm font-bold text-slate-900">Nueva Factura</h3>
                  <button onClick={() => setShowNewBillModal(false)}><Icons.X /></button>
                </div>
                <form onSubmit={handleAddBill} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-700 font-semibold mb-1">Nombre</label>
                    <input type="text" required placeholder="Ej. Luz Endesa, Internet" value={newBillTitle} onChange={e => setNewBillTitle(e.target.value)} className="w-full p-2 border rounded-lg" />
                  </div>
                  <div>
                    <label className="block text-slate-700 font-semibold mb-1">Importe (€)</label>
                    <input type="number" step="0.01" required placeholder="0.00" value={newBillAmount} onChange={e => setNewBillAmount(e.target.value)} className="w-full p-2 border rounded-lg" />
                  </div>
                  <div>
                    <label className="block text-slate-700 font-semibold mb-1">Vencimiento</label>
                    <input type="date" required value={newBillDate} onChange={e => setNewBillDate(e.target.value)} className="w-full p-2 border rounded-lg" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onClick={() => setShowNewBillModal(false)} className="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600">Cancelar</button>
                    <button type="submit" className="px-3 py-1.5 rounded-lg bg-sky-600 text-white font-semibold">Guardar Factura</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-400">
            HogarSync · Administrador Integral del Hogar
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
